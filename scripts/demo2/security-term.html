<!doctype html><html><head><meta charset="utf8"><style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@600;800&display=swap');
  html,body{margin:0;height:100%;background:#0b0d12;font-family:'JetBrains Mono',monospace}
  #term{padding:48px 56px;color:#d7dce6;font-size:19px;line-height:1.75}
  .c{color:#7f8aa0}.g{color:#4fd39a}.r{color:#ff7a8a}.b{color:#6d8bff}.w{color:#fff;font-weight:600}
  .prompt{color:#4fd39a}.cursor{background:#d7dce6;color:#0b0d12}
  .line{white-space:pre-wrap;opacity:0}.line.show{opacity:1}
  #title{position:fixed;top:0;left:0;right:0;padding:18px 56px;background:#14171f;border-bottom:1px solid #262b36;
    font-family:Inter,sans-serif;font-size:15px;color:#9099a8;display:flex;gap:10px;align-items:center}
  #title b{color:#e9ecf2;font-weight:800}#title .dot{width:11px;height:11px;border-radius:50%;background:#ff5f57}
  #title .dot2{background:#febc2e}#title .dot3{background:#28c840}
  #term{margin-top:60px}
</style></head><body>
<div id="title"><span class="dot"></span><span class="dot dot2"></span><span class="dot dot3"></span>
  &nbsp;<b>security/probes</b> &nbsp;·&nbsp; reproduced on AssemblyAI production &nbsp;·&nbsp; our own key only</div>
<div id="term"></div>
<script>
const L = [
  {t:'<span class="prompt">$</span> node token-concurrency-scope.mjs', d:0},
  {t:'<span class="c"># the starter calls this token "single-use". test it.</span>', d:1},
  {t:'', d:1},
  {t:'<span class="c"># how many sessions can ONE token open at once?</span>', d:1},
  {t:'one token, 5 simultaneous sessions: <span class="r w">5/5 accepted</span>', d:1},
  {t:'', d:1},
  {t:'<span class="c"># does a token work on a product it was never minted for?</span>', d:1},
  {t:'streaming token &rarr; TTS:          <span class="r">ACCEPTED — cross-product</span>', d:1},
  {t:'streaming token &rarr; Voice Agent:  <span class="r">ACCEPTED — cross-product</span>', d:1},
  {t:'voice-agent token &rarr; TTS:        <span class="r">ACCEPTED — cross-product</span>', d:1},
  {t:'voice-agent token &rarr; streaming:  <span class="r">ACCEPTED — cross-product</span>', d:1},
  {t:'', d:1},
  {t:'<span class="c"># controls that DO hold, to be fair:</span>', d:1},
  {t:'3s token used after 8s:  <span class="g">rejected — TTL enforced ✓</span>', d:1},
  {t:'request 24h TTL:         <span class="g">422, capped at 600s ✓</span>', d:1},
];
const term = document.getElementById('term');
L.forEach((l) => { const d = document.createElement('div'); d.className = 'line'; d.innerHTML = l.t || '&nbsp;'; term.appendChild(d); });
window.__reveal = (i) => { const els = term.children; for (let k = 0; k <= i && k < els.length; k++) els[k].classList.add('show'); };
window.__count = L.length;
</script></body></html>
